<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0d1610" />
  <title>Focus | Notes</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/header.css" />
  <link rel="stylesheet" href="css/notes.css" />
  <link rel="stylesheet" href="css/modals.css" />
  <link rel="stylesheet" href="css/mobile.css" />
  <link rel="stylesheet" href="css/forms.css" />
  <link rel="stylesheet" href="css/desktop.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>

  <div id="ambient-glow"></div>
  <canvas id="particles-canvas" style="position:fixed;inset:0;pointer-events:none;z-index:9999;"></canvas>
  <div id="flash-overlay"></div>

  <div id="app">
    <header class="header">
      <div class="header-inner">
        <div class="header-left">
          <div id="mobile-note-header" style="display:flex;align-items:center;gap:8px;">
            <button id="mobile-note-switch" onclick="openNotesManagerModal()" style="display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--text-1);font-size:15px;font-weight:600;cursor:pointer;padding:4px 0;">
              <span id="mobile-note-title">Notes</span>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>
        <div class="header-right">
        </div>
      </div>
    </header>

    <!-- Desktop split layout -->
    <div id="desktop-layout">

      <!-- Left: Notes editor -->
      <div id="desktop-notes-area">
        <main class="main notes-active">
          <div id="tab-notes" style="display:flex;flex-direction:column;flex:1;height:100%;">
            <div class="notes-toolbar">
              <button type="button" class="format-btn" data-format="bold" title="Bold"><strong>B</strong></button>
              <button type="button" class="format-btn" data-format="italic" title="Italic"><em>I</em></button>
              <button type="button" class="format-btn" data-format="strike" title="Strikethrough"><s>S</s></button>
              <button type="button" class="format-btn" data-format="h1" title="Heading 1">H1</button>
              <button type="button" class="format-btn" data-format="h2" title="Heading 2">H2</button>
              <button type="button" class="format-btn" data-format="h3" title="Heading 3">H3</button>
              <button type="button" class="format-btn" data-format="bullet" title="Bullet List">•</button>
              <button type="button" class="format-btn" data-format="numbered" title="Numbered List">1.</button>
              <button type="button" class="format-btn" data-format="code" title="Inline Code"><code>&lt;/&gt;</code></button>
              <button type="button" class="format-btn" data-format="codeblock" title="Code Block">```</button>
              <button type="button" class="format-btn" data-format="hr" title="Divider">—</button>
            </div>
            <div id="notes-textarea" class="notes-editor" contenteditable="true" spellcheck="false" data-placeholder="Start writing…"></div>
          </div>
        </main>

        <button class="fab" id="fab" onclick="openNotesManagerModal()" aria-label="Manage notes">
          <svg width="22" height="22" viewBox="0 0 20 20" fill="none">
            <path d="M10 3v14M3 10h14" stroke="#07100c" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <!-- Resize handle -->
      <div id="panel-resize-handle"></div>

      <!-- Right: Notes list panel -->
      <div id="side-panel" class="open">
        <div id="side-panel-header">
          <span id="panel-title">Notes</span>
          <div id="panel-date-navigator" class="panel-date-navigator"></div>
          <div id="side-panel-actions">
            <button class="panel-action-btn" id="panel-add-btn" onclick="createAndLoadBlankNotesEntry()" title="New note">
              <svg width="14" height="14" viewBox="0 0 20 20" fill="none"><path d="M10 3v14M3 10h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
            </button>
          </div>
        </div>
        <div id="side-panel-body">
          <div id="panel-notes-content" style="display: block;"></div>
        </div>
      </div>

    </div><!-- /desktop-layout -->

    <button id="panel-toggle-btn" onclick="toggleSidePanel()" title="Toggle panel" aria-label="Toggle side panel">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
        <path d="M7 1L3 5L7 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

  </div><!-- /app -->

  <!-- Notes manager modal -->
  <div class="modal-backdrop" id="notes-manager-modal" onclick="closeNotesManagerOnBackdrop(event)">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <h2 class="modal-title">Notes</h2>
      <div id="notes-docs-list" style="margin-bottom:12px;max-height:40vh;overflow-y:auto;"></div>
      <div style="border-top:1px solid var(--border);padding-top:12px;">
        <p style="font-size:11px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-3);margin-bottom:8px;">New note</p>
        <div class="form-group" style="margin-bottom:0">
          <input id="notes-new-title" type="text" placeholder="Note title…" autocomplete="off" />
        </div>
      </div>
      <div class="modal-actions" style="justify-content:space-between">
        <button class="btn-ghost" onclick="closeNotesManagerModal()">Close</button>
        <button class="btn-primary" onclick="createNewNoteDoc()">Create</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div id="app-loading-overlay" style="position:fixed;inset:0;z-index:10000;background:var(--ink);display:flex;align-items:center;justify-content:center;transition:opacity 0.3s ease;">
    <div style="text-align:center;">
      <div style="font-size:64px;margin-bottom:20px;animation:floatBob 3s ease-in-out infinite;">📝</div>
      <div style="color:var(--mint);font-family:'Fraunces',serif;font-size:24px;letter-spacing:-0.5px;">Notes</div>
      <div class="spinner" style="margin-top:24px;"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/utils/date.js"></script>
  <script src="config.js" onerror="window.APP_CONFIG={}"></script>
  <script src="js/idb.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/state.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/journal.js"></script>
  <script src="js/desktop.js"></script>
  <script src="js/init.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    }
  </script>
</body>
</html>
