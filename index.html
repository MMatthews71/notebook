<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1610" />
  <title>Focus</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      min-height: 100%;
      background: #080d09;
      color: #e8f0e9;
      font-family: 'DM Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px 20px calc(32px + env(safe-area-inset-bottom));
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #7a8a7d;
      font-size: 14px;
      font-weight: 300;
      margin-bottom: 36px;
    }

    .apps {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 160px));
      gap: 14px;
      justify-content: center;
      width: 100%;
      max-width: 560px;
    }

    .app-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 26px 14px 22px;
      background: #0d1610;
      border: 1px solid #1b2a1e;
      border-radius: 18px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .app-card:hover {
      transform: translateY(-3px);
      border-color: #2e4a33;
      background: #101b13;
    }

    .app-card:active { transform: scale(0.97); }

    .app-card img {
      width: 52px;
      height: 52px;
      border-radius: 12px;
    }

    .app-card .name {
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
    }

    .app-card .desc {
      color: #7a8a7d;
      font-size: 12px;
      font-weight: 300;
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <h1>Focus</h1>
  <p class="subtitle">Pick an app</p>

  <nav class="apps">
    <a class="app-card" href="todo/">
      <img src="todo/icons/icon.svg" alt="" />
      <span class="name">Tasks</span>
      <span class="desc">Goals, habits &amp; to-dos</span>
    </a>
    <a class="app-card" href="notes/">
      <img src="notes/icons/icon.svg" alt="" />
      <span class="name">Notes</span>
      <span class="desc">Quick notes &amp; docs</span>
    </a>
    <a class="app-card" href="journal/">
      <img src="journal/icons/icon.svg" alt="" />
      <span class="name">Journal</span>
      <span class="desc">Daily reflections</span>
    </a>
    <a class="app-card" href="nutrition/">
      <img src="nutrition/icons/icon.svg" alt="" />
      <span class="name">Nutrition</span>
      <span class="desc">Meals &amp; macros</span>
    </a>
    <a class="app-card" href="finance/">
      <img src="finance/icons/icon.svg" alt="" />
      <span class="name">Finance</span>
      <span class="desc">Accounts &amp; spending</span>
    </a>
  </nav>

  <script>
    // Keep registering the root SW so devices that installed the old
    // combined app pick up the self-destructing version in sw.js.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    }
  </script>
</body>
</html>
