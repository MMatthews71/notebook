<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0d1610" />
  <title>Focus | Finance</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <link rel="stylesheet" href="css/base.css?v=2" />
  <link rel="stylesheet" href="css/header.css?v=5" />
  <link rel="stylesheet" href="css/finance.css?v=5" />
  <link rel="stylesheet" href="css/banking.css" />
  <link rel="stylesheet" href="css/modals.css?v=9" />
  <link rel="stylesheet" href="css/mobile.css?v=3" />
  <link rel="stylesheet" href="css/forms.css" />
  <link rel="stylesheet" href="css/auth.css?v=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>

  <div id="ambient-glow"></div>
  <canvas id="particles-canvas" style="position:fixed;inset:0;pointer-events:none;z-index:9999;"></canvas>
  <div id="flash-overlay"></div>

  <div id="app">
    <header class="header">
      <div class="header-inner">
        <div class="header-left">
          <span style="font-family:'Fraunces',serif;font-size:18px;font-weight:500;color:var(--text-1);">Finance</span>
        </div>
        <div class="header-right">
          <button id="auth-status-btn" onclick="authSignOut()" aria-label="Sign out">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
              <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="main notes-active">
      <div id="tab-finance">
        <!-- rendered by renderFinanceTab() -->
      </div>
    </main>

    <button class="fab" id="fab" onclick="openAddTransactionModal()" aria-label="Add transaction">
      <svg width="22" height="22" viewBox="0 0 20 20" fill="none">
        <path d="M10 3v14M3 10h14" stroke="#07100c" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </button>
  </div><!-- /app -->

  <!-- Finance: Account Modal -->
  <div class="modal-backdrop" id="fin-account-modal" onclick="if(event.target===this)closeFinAccountModal()">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div class="modal-handle"></div>
      <h2 class="modal-title">Bank Account</h2>
      <input type="hidden" id="fin-acc-id" />
      <div class="fin-field">
        <label class="fin-label">Account name</label>
        <input class="fin-input" id="fin-acc-name" type="text" placeholder="e.g. Everyday, Savings" />
      </div>
      <div class="fin-field">
        <label class="fin-label">Bank</label>
        <input class="fin-input" id="fin-acc-bank" type="text" placeholder="e.g. ING, NAB, Commonwealth" />
      </div>
      <div class="fin-field">
        <label class="fin-label">Current balance ($)</label>
        <input class="fin-input" id="fin-acc-balance" type="number" step="0.01" placeholder="0.00" />
      </div>
      <button class="fin-save-btn" id="fin-acc-save-btn" onclick="saveFinAccount()">Save</button>
      <button class="fin-delete-btn" id="fin-acc-delete-btn" onclick="deleteFinAccount()" style="display:none">Delete account</button>
    </div>
  </div>

  <!-- Finance: Add Transaction Modal -->
  <div class="modal-backdrop" id="fin-tx-modal" onclick="if(event.target===this)closeFinTxModal()">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div class="modal-handle"></div>
      <h2 class="modal-title">Transaction</h2>
      <div class="fin-modal-tabs">
        <button class="fin-modal-tab active" data-tab="photo" onclick="finModalTab('photo')">📷 Receipt</button>
        <button class="fin-modal-tab" data-tab="manual" onclick="finModalTab('manual')">✏️ Manual</button>
      </div>
      <div class="fin-modal-panel active" data-panel="photo">
        <input type="file" id="fin-photo-input" accept="image/*" capture="environment" style="display:none" onchange="finPhotoSelected(this)" />
        <div class="fin-photo-drop" id="fin-photo-drop" onclick="document.getElementById('fin-photo-input').click()">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="18" height="14" rx="2" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="13" r="3" stroke="currentColor" stroke-width="2"/><path d="M8 6V5a1 1 0 011-1h6a1 1 0 011 1v1" stroke="currentColor" stroke-width="2"/></svg>
          <span>Tap to photograph receipt</span>
        </div>
        <img id="fin-photo-preview" class="fin-photo-preview" style="display:none" alt="Receipt" />
        <div id="fin-currency-row" style="display:none; margin-top:12px;">
          <label style="font-size:12px;font-weight:600;color:var(--text-3);display:block;margin-bottom:6px;">Currency</label>
          <select id="fin-currency-select" style="width:100%">
            <option value="AUD">AUD — Australian Dollar</option>
            <option value="USD">USD — US Dollar</option>
            <option value="EUR">EUR — Euro</option>
            <option value="GBP">GBP — British Pound</option>
            <option value="SGD">SGD — Singapore Dollar</option>
            <option value="THB">THB — Thai Baht</option>
            <option value="JPY">JPY — Japanese Yen</option>
            <option value="CNY">CNY — Chinese Yuan</option>
            <option value="HKD">HKD — Hong Kong Dollar</option>
            <option value="CAD">CAD — Canadian Dollar</option>
            <option value="NZD">NZD — New Zealand Dollar</option>
            <option value="INR">INR — Indian Rupee</option>
            <option value="IDR">IDR — Indonesian Rupiah</option>
            <option value="MYR">MYR — Malaysian Ringgit</option>
            <option value="PHP">PHP — Philippine Peso</option>
            <option value="VND">VND — Vietnamese Dong</option>
            <option value="KRW">KRW — South Korean Won</option>
          </select>
        </div>
        <button class="fin-scan-btn" id="fin-scan-btn" onclick="finScanReceipt()" style="display:none">✨ Scan receipt</button>
        <div class="fin-scan-status" id="fin-scan-status" style="display:none"></div>
        <div id="fin-receipt-preview" class="fin-receipt-preview" style="display:none"></div>
      </div>
      <div class="fin-modal-panel" data-panel="manual">
        <div id="fin-receipt-preview-manual" style="display:none"></div>
        <div class="fin-amount-row" style="margin-bottom:8px">
          <button class="fin-type-btn active-expense" id="fin-type-expense" onclick="finSetType('expense')" style="flex:1">− Expense</button>
          <button class="fin-type-btn" id="fin-type-income" onclick="finSetType('income')" style="flex:1">+ Income</button>
        </div>
        <div class="fin-amount-row">
          <div class="fin-field" style="flex:2">
            <label class="fin-label">Account</label>
            <select class="fin-select" id="fin-tx-account"></select>
          </div>
          <div class="fin-field" style="flex:1">
            <label class="fin-label">Currency</label>
            <select class="fin-select" id="fin-tx-currency" onchange="_finUpdateConvertBtn()">
              <option value="AUD">AUD</option>
              <option value="USD">USD</option>
              <option value="EUR">EUR</option>
              <option value="GBP">GBP</option>
              <option value="SGD">SGD</option>
              <option value="THB">THB</option>
              <option value="JPY">JPY</option>
              <option value="CNY">CNY</option>
              <option value="HKD">HKD</option>
              <option value="CAD">CAD</option>
              <option value="NZD">NZD</option>
              <option value="INR">INR</option>
              <option value="IDR">IDR</option>
              <option value="MYR">MYR</option>
              <option value="PHP">PHP</option>
              <option value="VND">VND</option>
              <option value="KRW">KRW</option>
            </select>
          </div>
        </div>
        <div class="fin-field">
          <label class="fin-label">Description</label>
          <input class="fin-input" id="fin-tx-desc" type="text" placeholder="e.g. Woolworths, Petrol" />
        </div>
        <div class="fin-amount-row">
          <div class="fin-field" style="flex:1">
            <label class="fin-label">Amount</label>
            <input class="fin-input" id="fin-tx-amount" type="number" step="0.01" placeholder="0.00" />
          </div>
          <div class="fin-field" style="flex:1">
            <label class="fin-label">Date</label>
            <input class="fin-input" id="fin-tx-date" type="date" />
          </div>
        </div>
        <div id="fin-convert-row" style="display:none; margin-bottom:8px;">
          <button type="button" id="fin-convert-btn" class="fin-convert-btn" onclick="finConvertToAUD()">↔ Convert to AUD</button>
          <div id="fin-convert-status"></div>
        </div>
        <div class="fin-amount-row">
          <div class="fin-field" style="flex:1">
            <label class="fin-label">Category</label>
            <select class="fin-select" id="fin-tx-category">
              <option value="">Select…</option>
              <option>Food &amp; Dining</option>
              <option>Transport</option>
              <option>Shopping</option>
              <option>Bills &amp; Utilities</option>
              <option>Entertainment</option>
              <option>Health</option>
              <option>Education</option>
              <option>Travel</option>
              <option>Income</option>
              <option>Other</option>
            </select>
          </div>
          <div class="fin-field" style="flex:1">
            <label class="fin-label">Merchant</label>
            <input class="fin-input" id="fin-tx-merchant" type="text" placeholder="Store name" />
          </div>
        </div>
        <input type="hidden" id="fin-tx-notes" value="" />
        <button class="fin-save-btn" id="fin-tx-save-btn" onclick="finSaveTx()">Save</button>
        <button class="fin-delete-btn" id="fin-tx-delete-btn" onclick="finDeleteTx()" style="display:none">Delete</button>
      </div>
    </div>
  </div>

  <!-- Finance: Recurring Payment Modal -->
  <div class="modal-backdrop" id="fin-rec-modal" onclick="if(event.target===this)closeFinRecModal()">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div class="modal-handle"></div>
      <h2 class="modal-title">Recurring Payment</h2>
      <div class="fin-field">
        <label class="fin-label">Type</label>
        <div class="fin-type-toggle">
          <button class="fin-type-btn active-expense" id="fin-rec-type-expense" onclick="finSetRecType('expense')">− Expense</button>
          <button class="fin-type-btn" id="fin-rec-type-income" onclick="finSetRecType('income')">+ Income</button>
        </div>
      </div>
      <div class="fin-field">
        <label class="fin-label">Name</label>
        <input class="fin-input" id="fin-rec-name" type="text" placeholder="e.g. Netflix, Rent, Salary" />
      </div>
      <div class="fin-amount-row">
        <div class="fin-field" style="flex:1">
          <label class="fin-label">Amount ($)</label>
          <input class="fin-input" id="fin-rec-amount" type="number" step="0.01" placeholder="0.00" />
        </div>
        <div class="fin-field" style="flex:1">
          <label class="fin-label">Frequency</label>
          <select class="fin-select" id="fin-rec-frequency">
            <option value="weekly">Weekly</option>
            <option value="fortnightly">Fortnightly</option>
            <option value="monthly" selected>Monthly</option>
            <option value="yearly">Yearly</option>
          </select>
        </div>
      </div>
      <div class="fin-amount-row">
        <div class="fin-field" style="flex:1">
          <label class="fin-label">Category</label>
          <select class="fin-select" id="fin-rec-category">
            <option value="">Select…</option>
            <option>Food &amp; Dining</option>
            <option>Transport</option>
            <option>Shopping</option>
            <option>Bills &amp; Utilities</option>
            <option>Entertainment</option>
            <option>Health</option>
            <option>Education</option>
            <option>Travel</option>
            <option>Income</option>
            <option>Other</option>
          </select>
        </div>
        <div class="fin-field" style="flex:1">
          <label class="fin-label">Next due date</label>
          <input class="fin-input" id="fin-rec-due" type="date" />
        </div>
      </div>
      <button class="fin-save-btn" id="fin-rec-save-btn" onclick="finSaveRec()">Save</button>
      <button class="fin-delete-btn" id="fin-rec-delete-btn" onclick="finDeleteRec()" style="display:none">Delete</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div id="app-loading-overlay" style="position:fixed;inset:0;z-index:10000;background:var(--ink);display:flex;align-items:center;justify-content:center;transition:opacity 0.3s ease;">
    <div style="text-align:center;">
      <div style="font-size:64px;margin-bottom:20px;animation:floatBob 3s ease-in-out infinite;">💳</div>
      <div style="color:var(--mint);font-family:'Fraunces',serif;font-size:24px;letter-spacing:-0.5px;">Finance</div>
      <div class="spinner" style="margin-top:24px;"></div>
    </div>
  </div>

  <!-- Login screen -->
  <div id="login-screen">
    <div class="auth-card">
      <div class="auth-logo">💳</div>
      <h1 class="auth-title">Finance</h1>
      <div id="auth-bio-section" style="display:none">
        <button id="auth-unlock-btn" class="auth-bio-btn" onclick="_authUnlockBio()">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none">
            <path d="M12 2C9.2 2 7 4.2 7 7v1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M17 8v-1c0-2.8-2.2-5-5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M12 11v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <ellipse cx="12" cy="11" rx="1.2" ry="1.2" fill="currentColor"/>
            <path d="M5 12c0 3.9 3.1 7 7 7s7-3.1 7-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M8.5 12c0 1.9 1.6 3.5 3.5 3.5s3.5-1.6 3.5-3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <span>Unlock</span>
        </button>
        <p id="auth-error" class="auth-error"></p>
      </div>
      <div id="auth-setup-pw-section" style="display:none">
        <p class="auth-setup-hint">Enter your password to register your biometric.</p>
        <input type="password" id="auth-setup-pw-input" class="auth-input" placeholder="Password" autocomplete="current-password" onkeydown="_authSetupPwKeydown(event)" />
        <button class="auth-btn" onclick="_authSetupPwSubmit()">Continue</button>
        <p id="auth-setup-pw-error" class="auth-error"></p>
      </div>
      <div id="auth-setup-section" style="display:none">
        <p class="auth-setup-hint">Register your face or fingerprint to unlock this app.</p>
        <button id="auth-setup-btn" class="auth-btn" onclick="_authSetupBio()">Set up biometric</button>
        <p id="auth-setup-error" class="auth-error"></p>
      </div>
      <div id="auth-pw-section" style="display:none">
        <input type="password" id="auth-password" class="auth-input" placeholder="Password" autocomplete="current-password" onkeydown="_authPwKeydown(event)" />
        <button class="auth-btn" onclick="_authPwUnlock()">Unlock</button>
        <p id="auth-pw-error" class="auth-error"></p>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/utils/date.js"></script>
  <script src="config.js" onerror="window.APP_CONFIG={}"></script>
  <script src="js/idb.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/state.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/finance.js"></script>
  <script src="js/banking.js"></script>
  <script src="js/init.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    }
  </script>
</body>
</html>
