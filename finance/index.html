<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0B0C12" />
  <title>Focus | Finance</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <link rel="stylesheet" href="css/base.css?v=2" />
  <link rel="stylesheet" href="css/header.css?v=5" />
  <link rel="stylesheet" href="css/finance.css?v=6" />
  <link rel="stylesheet" href="css/banking.css" />
  <link rel="stylesheet" href="css/modals.css?v=9" />
  <link rel="stylesheet" href="css/mobile.css?v=3" />
  <link rel="stylesheet" href="css/forms.css" />
  <link rel="stylesheet" href="css/auth.css?v=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>

  <div id="ambient-glow"></div>
  <canvas id="particles-canvas" style="position:fixed;inset:0;pointer-events:none;z-index:9999;"></canvas>
  <div id="flash-overlay"></div>

  <div id="app">
    <header class="header">
      <div class="header-inner">
        <div class="header-left">
          <span style="font-family:'Fraunces',serif;font-size:18px;font-weight:500;color:var(--text-1);">Finance</span>
        </div>
        <div class="header-right"></div>
      </div>
    </header>

    <main class="main notes-active">
      <div id="tab-finance">
        <!-- rendered by renderFinanceTab() -->
      </div>
    </main>

    <button class="fab" id="fab" onclick="openAddTransactionModal()" aria-label="Add transaction">
      <svg width="22" height="22" viewBox="0 0 20 20" fill="none">
        <path d="M10 3v14M3 10h14" stroke="#0B0C12" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </button>
  </div><!-- /app -->

  <!-- Finance: Account Modal -->
  <div class="modal-backdrop" id="fin-account-modal" onclick="if(event.target===this)closeFinAccountModal()">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div class="modal-handle"></div>
      <h2 class="modal-title">Bank Account</h2>
      <input type="hidden" id="fin-acc-id" />
      <div class="fin-field">
        <label class="fin-label">Account name</label>
        <input class="fin-input" id="fin-acc-name" type="text" placeholder="e.g. Everyday, Savings" />
      </div>
      <div class="fin-field">
        <label class="fin-label">Bank</label>
        <input class="fin-input" id="fin-acc-bank" type="text" placeholder="e.g. ING, NAB, Commonwealth" />
      </div>
      <div class="fin-field">
        <label class="fin-label">Current balance ($)</label>
        <input class="fin-input" id="fin-acc-balance" type="number" step="0.01" placeholder="0.00" />
      </div>
      <button class="fin-save-btn" id="fin-acc-save-btn" onclick="saveFinAccount()">Save</button>
      <button class="fin-delete-btn" id="fin-acc-delete-btn" onclick="deleteFinAccount()" style="display:none">Delete account</button>
    </div>
  </div>

  <!-- Finance: Add Transaction Modal -->
  <div class="modal-backdrop" id="fin-tx-modal" onclick="if(event.target===this)closeFinTxModal()">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div class="modal-handle"></div>
      <h2 class="modal-title">Transaction</h2>
      <div class="fin-field">
        <div class="fin-type-toggle">
          <button class="fin-type-btn active-expense" id="fin-tx-type-expense" onclick="finSetTxType('expense')">− Expense</button>
          <button class="fin-type-btn" id="fin-tx-type-income" onclick="finSetTxType('income')">+ Income</button>
        </div>
      </div>
      <div class="fin-field">
        <label class="fin-label">Description</label>
        <input class="fin-input" id="fin-tx-desc" type="text" placeholder="e.g. Woolworths, Petrol" enterkeyhint="next" onkeydown="if(event.key==='Enter'){event.preventDefault();document.getElementById('fin-tx-amount').focus();}" />
      </div>
      <div class="fin-amount-row">
        <div class="fin-field" style="flex:2">
          <label class="fin-label">Amount</label>
          <input class="fin-input" id="fin-tx-amount" type="number" step="0.01" inputmode="decimal" placeholder="0.00" enterkeyhint="next" onkeydown="if(event.key==='Enter'){event.preventDefault();document.getElementById('fin-tx-currency').focus();}" />
        </div>
        <div class="fin-field" style="flex:1">
          <label class="fin-label">Currency</label>
          <select class="fin-select" id="fin-tx-currency" onkeydown="if(event.key==='Enter'){event.preventDefault();document.getElementById('fin-tx-account').focus();}" onchange="document.getElementById('fin-tx-account').focus()">
            <option value="AUD">AUD</option>
            <option value="USD">USD</option>
            <option value="EUR">EUR</option>
            <option value="GBP">GBP</option>
            <option value="SGD">SGD</option>
            <option value="THB">THB</option>
            <option value="JPY">JPY</option>
            <option value="CNY">CNY</option>
            <option value="HKD">HKD</option>
            <option value="CAD">CAD</option>
            <option value="NZD">NZD</option>
            <option value="INR">INR</option>
            <option value="IDR">IDR</option>
            <option value="MYR">MYR</option>
            <option value="PHP">PHP</option>
            <option value="KRW">KRW</option>
          </select>
        </div>
      </div>
      <div class="fin-field">
        <label class="fin-label">Account</label>
        <select class="fin-select" id="fin-tx-account" onkeydown="if(event.key==='Enter'){event.preventDefault();finSaveTx();}" onchange="document.getElementById('fin-tx-save-btn').focus()">
          <!-- populated by openAddTransactionModal / openFinTxDetail -->
        </select>
      </div>
      <button class="fin-save-btn" id="fin-tx-save-btn" onclick="finSaveTx()">Save</button>
      <button class="fin-delete-btn" id="fin-tx-delete-btn" onclick="finDeleteTx()" style="display:none">Delete</button>
    </div>
  </div>

  <!-- Finance: Recurring Payment Modal -->
  <div class="modal-backdrop" id="fin-rec-modal" onclick="if(event.target===this)closeFinRecModal()">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div class="modal-handle"></div>
      <h2 class="modal-title">Recurring Payment</h2>
      <div class="fin-field">
        <label class="fin-label">Type</label>
        <div class="fin-type-toggle">
          <button class="fin-type-btn active-expense" id="fin-rec-type-expense" onclick="finSetRecType('expense')">− Expense</button>
          <button class="fin-type-btn" id="fin-rec-type-income" onclick="finSetRecType('income')">+ Income</button>
        </div>
      </div>
      <div class="fin-field">
        <label class="fin-label">Name</label>
        <input class="fin-input" id="fin-rec-name" type="text" placeholder="e.g. Netflix, Rent, Salary" />
      </div>
      <div class="fin-amount-row">
        <div class="fin-field" style="flex:1">
          <label class="fin-label">Amount ($)</label>
          <input class="fin-input" id="fin-rec-amount" type="number" step="0.01" placeholder="0.00" />
        </div>
        <div class="fin-field" style="flex:1">
          <label class="fin-label">Frequency</label>
          <select class="fin-select" id="fin-rec-frequency">
            <option value="weekly">Weekly</option>
            <option value="fortnightly">Fortnightly</option>
            <option value="monthly" selected>Monthly</option>
            <option value="yearly">Yearly</option>
          </select>
        </div>
      </div>
      <div class="fin-amount-row">
        <div class="fin-field" style="flex:1">
          <label class="fin-label">Category</label>
          <select class="fin-select" id="fin-rec-category">
            <option value="">Select…</option>
            <option>Food &amp; Dining</option>
            <option>Transport</option>
            <option>Shopping</option>
            <option>Bills &amp; Utilities</option>
            <option>Entertainment</option>
            <option>Health</option>
            <option>Education</option>
            <option>Travel</option>
            <option>Income</option>
            <option>Other</option>
          </select>
        </div>
        <div class="fin-field" style="flex:1">
          <label class="fin-label">Next due date</label>
          <input class="fin-input" id="fin-rec-due" type="date" />
        </div>
      </div>
      <button class="fin-save-btn" id="fin-rec-save-btn" onclick="finSaveRec()">Save</button>
      <button class="fin-delete-btn" id="fin-rec-delete-btn" onclick="finDeleteRec()" style="display:none">Delete</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div id="app-loading-overlay" style="position:fixed;inset:0;z-index:10000;background:var(--bg);display:flex;align-items:center;justify-content:center;transition:opacity 0.3s ease;">
    <div style="text-align:center;">
      <div style="font-size:52px;margin-bottom:16px;">💳</div>
      <div style="color:var(--text-2);font-family:var(--font-body);font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;">Finance</div>
      <div class="spinner" style="margin-top:20px;"></div>
    </div>
  </div>


  <!-- Scripts -->
  <script src="js/utils/date.js"></script>
  <script src="config.js" onerror="window.APP_CONFIG={}"></script>
  <script src="js/idb.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/finance.js"></script>
  <script src="js/banking.js"></script>
  <script src="js/init.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    }
  </script>
</body>
</html>
