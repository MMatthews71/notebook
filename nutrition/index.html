<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0d1610" />
  <title>Focus | Nutrition</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/header.css" />
  <link rel="stylesheet" href="css/nutrition.css" />
  <link rel="stylesheet" href="css/modals.css" />
  <link rel="stylesheet" href="css/mobile.css" />
  <link rel="stylesheet" href="css/forms.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>

  <div id="ambient-glow"></div>
  <canvas id="particles-canvas" style="position:fixed;inset:0;pointer-events:none;z-index:9999;"></canvas>
  <div id="flash-overlay"></div>

  <div id="app">
    <header class="header">
      <div class="header-inner">
        <div class="header-left">
          <div class="date-navigator">
            <button class="nav-btn" onclick="offsetActiveDate(-1)" aria-label="Previous day">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <span class="header-date" id="header-date" onclick="toggleCalendarView()" title="Open Calendar"></span>
            <button class="nav-btn" onclick="offsetActiveDate(1)" aria-label="Next day">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Desktop split layout: main area + sidebar -->
    <div id="nutr-layout">

      <!-- Main scrollable area -->
      <div id="nutr-main-wrap">
        <main id="nutr-main">
          <!-- Calendar overlay -->
          <div id="calendar-view" style="display:none" onclick="if(event.target===this)toggleCalendarView()">
            <div class="cal-picker-card">
              <div class="calendar-header">
                <button class="cal-nav" onclick="prevMonth()">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <h2 id="cal-month-year"></h2>
                <button class="cal-nav" onclick="nextMonth()">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
              </div>
              <div class="calendar-weekdays">
                <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
              </div>
              <div id="calendar-grid" class="calendar-grid"></div>
            </div>
          </div>

          <!-- Diary + pantry content -->
          <div id="nutrition-content"></div>
        </main>

        <!-- FAB lives inside main-wrap so it doesn't overlap the sidebar -->
        <div id="fab-overlay" onclick="closeFabDial()"></div>
        <div class="fab-dial">
          <div class="fab-dial-menu" id="fab-dial-menu">

            <button class="fab-dial-item" onclick="closeFabDial();openLogMealModal()">
              <span class="fab-dial-label">Log a meal</span>
              <div class="fab-mini">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                  <path d="M3 11l19-9-9 19-2-8-8-2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </div>
            </button>

            <button class="fab-dial-item" onclick="closeFabDial();openAddItemModal()">
              <span class="fab-dial-label">Add item manually</span>
              <div class="fab-mini">
                <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
                  <path d="M10 3v14M3 10h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                </svg>
              </div>
            </button>

            <button class="fab-dial-item" onclick="closeFabDial();openScanReceiptModal()">
              <span class="fab-dial-label">Scan receipt</span>
              <div class="fab-mini">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                  <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  <circle cx="12" cy="13" r="4" stroke="currentColor" stroke-width="2"/>
                </svg>
              </div>
            </button>

          </div>
          <button class="fab" id="fab" onclick="toggleFabDial()" aria-label="Actions">
            <svg width="22" height="22" viewBox="0 0 20 20" fill="none">
              <path d="M10 3v14M3 10h14" stroke="#07100c" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div><!-- /nutr-main-wrap -->

    </div><!-- /nutr-layout -->
  </div><!-- /app -->

  <!-- ── Log Meal Modal ── -->
  <div class="modal-backdrop" id="log-meal-modal" onclick="closeLogMealOnBackdrop(event)">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div class="modal-handle"></div>
      <h2 class="modal-title">Log a Meal</h2>

      <div class="form-group" style="margin-bottom:12px">
        <label>Meal name <span class="label-optional">(optional)</span></label>
        <input id="meal-log-name" type="text" placeholder="e.g. Chicken &amp; rice" maxlength="80" />
      </div>

      <!-- Manual nutrition entry (always visible) -->
      <div class="meal-manual-section">
        <div class="nutr-form-row">
          <div class="form-group" style="margin-bottom:0">
            <label>Calories (kcal)</label>
            <input id="meal-manual-cal" type="number" min="0" step="any" placeholder="e.g. 550" oninput="_updateMealTotals()" />
          </div>
          <div class="form-group" style="margin-bottom:0">
            <label>Cost ($) <span class="label-optional">(opt)</span></label>
            <input id="meal-manual-cost" type="number" min="0" step="0.01" placeholder="e.g. 4.50" oninput="_updateMealTotals()" />
          </div>
        </div>
        <div class="nutr-form-row" style="grid-template-columns:1fr 1fr 1fr;margin-top:8px">
          <div class="form-group" style="margin-bottom:0">
            <label>Protein (g)</label>
            <input id="meal-manual-protein" type="number" min="0" step="any" placeholder="e.g. 40" oninput="_updateMealTotals()" />
          </div>
          <div class="form-group" style="margin-bottom:0">
            <label>Carbs (g)</label>
            <input id="meal-manual-carbs" type="number" min="0" step="any" placeholder="e.g. 60" oninput="_updateMealTotals()" />
          </div>
          <div class="form-group" style="margin-bottom:0">
            <label>Fat (g)</label>
            <input id="meal-manual-fat" type="number" min="0" step="any" placeholder="e.g. 15" oninput="_updateMealTotals()" />
          </div>
        </div>
      </div>

      <!-- Pantry picker (only shown when pantry has items) -->
      <div id="log-meal-pantry-section">
        <div class="meal-pantry-divider"><span>or add from pantry</span></div>
        <div class="form-group" style="margin-bottom:10px">
          <input id="meal-search" type="search" placeholder="Search pantry…"
                 oninput="_renderMealItems(this.value)"
                 style="background:var(--surface-3);border:1px solid var(--border);border-radius:8px;padding:8px 12px;width:100%;font-size:13px;color:var(--text-1);font-family:var(--font-body);outline:none;box-sizing:border-box" />
        </div>
        <div id="log-meal-items-list" class="meal-items-list"></div>
      </div>

      <div class="meal-totals-bar">
        <div class="meal-totals-row">
          <span class="meal-totals-label">Cost</span>
          <span class="meal-totals-val" id="meal-total-cost">$0.00</span>
        </div>
        <div class="meal-totals-row">
          <span class="meal-totals-label">Calories</span>
          <span class="meal-totals-val" id="meal-total-cal">0 kcal</span>
        </div>
        <p class="meal-totals-macros" id="meal-total-macros">—</p>
      </div>

      <div class="modal-actions">
        <button class="btn-ghost" onclick="closeLogMealModal()">Cancel</button>
        <button class="btn-primary" onclick="logMealFromPantry()">Log meal</button>
      </div>
    </div>
  </div>

  <!-- ── Add / Edit Item Modal ── -->
  <div class="modal-backdrop" id="add-item-modal" onclick="closeAddItemOnBackdrop(event)">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div class="modal-handle"></div>
      <h2 class="modal-title" id="add-item-title">Add Item</h2>

      <div class="form-group">
        <label>Item name</label>
        <input id="item-name" type="text" placeholder="e.g. Chicken Breast" maxlength="80" />
      </div>

      <div class="nutr-form-row">
        <div class="form-group" style="margin-bottom:0">
          <label>Quantity in stock</label>
          <input id="item-quantity" type="number" min="0" step="any" placeholder="e.g. 500" />
        </div>
        <div class="form-group" style="margin-bottom:0">
          <label>Unit</label>
          <select id="item-unit" onchange="_updateNutrLabel()">
            <option value="g">g (grams)</option>
            <option value="ml">ml</option>
            <option value="piece">piece(s)</option>
            <option value="kg">kg</option>
            <option value="L">L (litres)</option>
          </select>
        </div>
      </div>

      <div class="form-group" style="margin-top:12px">
        <label>Total price paid ($)</label>
        <input id="item-price" type="number" min="0" step="0.01" placeholder="e.g. 8.50" />
      </div>

      <div class="item-nutr-header">
        <span id="item-nutr-label" class="item-nutr-label">Nutrition (per 100g)</span>
        <button class="item-ai-btn" id="item-ai-btn" onclick="aiEstimateItemNutrition()">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"
              stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          </svg>
          AI fill
        </button>
      </div>

      <div class="nutr-form-row" style="margin-top:8px">
        <div class="form-group" style="margin-bottom:0">
          <label>Calories (kcal)</label>
          <input id="item-cal" type="number" min="0" step="any" placeholder="e.g. 165" />
        </div>
        <div class="form-group" style="margin-bottom:0">
          <label>Protein (g)</label>
          <input id="item-protein" type="number" min="0" step="any" placeholder="e.g. 31" />
        </div>
      </div>
      <div class="nutr-form-row" style="margin-top:8px">
        <div class="form-group" style="margin-bottom:0">
          <label>Carbs (g)</label>
          <input id="item-carbs" type="number" min="0" step="any" placeholder="e.g. 0" />
        </div>
        <div class="form-group" style="margin-bottom:0">
          <label>Fat (g)</label>
          <input id="item-fat" type="number" min="0" step="any" placeholder="e.g. 3.6" />
        </div>
      </div>

      <div class="modal-actions" style="margin-top:20px">
        <button class="item-delete-btn btn-ghost" id="item-delete-btn"
                style="display:none" onclick="deleteItem()">Delete</button>
        <div style="display:flex;gap:8px;margin-left:auto">
          <button class="btn-ghost" onclick="closeAddItemModal()">Cancel</button>
          <button class="btn-primary" onclick="saveItem()">Save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Scan Receipt Modal ── -->
  <div class="modal-backdrop" id="scan-receipt-modal" onclick="closeScanReceiptOnBackdrop(event)">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div class="modal-handle"></div>
      <h2 class="modal-title">Scan Receipt</h2>

      <div id="receipt-scan-panel">
        <label class="receipt-upload-zone" for="receipt-photo-input">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" style="opacity:.4">
            <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z" stroke="currentColor" stroke-width="1.5"/>
            <circle cx="12" cy="13" r="4" stroke="currentColor" stroke-width="1.5"/>
          </svg>
          <span>Tap to select receipt photo</span>
          <input type="file" id="receipt-photo-input" accept="image/*" capture="environment"
                 style="display:none" onchange="receiptPhotoSelected(this)" />
        </label>
        <img id="receipt-preview" src="" alt="Receipt preview" class="receipt-preview-img" style="display:none" />
        <div id="receipt-scan-status" class="nutr-analyze-status" style="display:none"></div>
        <div class="modal-actions" style="margin-top:12px">
          <button class="btn-ghost" onclick="closeScanReceiptModal()">Cancel</button>
          <button class="btn-primary" id="receipt-scan-btn"
                  style="display:none;align-items:center;gap:7px" onclick="scanReceipt()">
            Scan receipt
          </button>
        </div>
      </div>

      <div id="receipt-results-panel" style="display:none">
        <p class="receipt-hint">Review items — edit names, quantities, prices before adding.</p>
        <div id="scanned-items-list" class="scanned-list"></div>
        <div class="modal-actions" style="margin-top:14px">
          <button class="btn-ghost" onclick="closeScanReceiptModal()">Cancel</button>
          <button class="btn-primary" id="receipt-add-btn" onclick="addScannedItemsToPantry()">
            Add all to pantry
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Nutrition Settings Modal ── -->
  <div class="modal-backdrop" id="nutrition-settings-modal" onclick="closeNutritionSettingsOnBackdrop(event)">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div class="modal-handle"></div>
      <h2 class="modal-title">Nutrition Settings</h2>
      <div class="nutr-settings-section">
        <p class="nutr-settings-section-title">Profile</p>
        <div class="nutr-form-row">
          <div class="form-group" style="margin-bottom:0">
            <label>Age</label>
            <input type="number" id="nutr-edit-age" placeholder="e.g. 28" min="10" max="100" />
          </div>
          <div class="form-group" style="margin-bottom:0">
            <label>Sex</label>
            <select id="nutr-edit-sex">
              <option value="male">Male</option>
              <option value="female">Female</option>
            </select>
          </div>
        </div>
        <div class="nutr-form-row" style="margin-top:12px">
          <div class="form-group" style="margin-bottom:0">
            <label>Height (cm)</label>
            <input type="number" id="nutr-edit-height" placeholder="e.g. 175" />
          </div>
          <div class="form-group" style="margin-bottom:0">
            <label>Weight (kg)</label>
            <input type="number" id="nutr-edit-weight" placeholder="e.g. 75" />
          </div>
        </div>
        <div class="nutr-form-row single" style="margin-top:12px">
          <div class="form-group" style="margin-bottom:0">
            <label>Activity Level</label>
            <select id="nutr-edit-activity">
              <option value="sedentary">Sedentary</option>
              <option value="light">Light (1–3×/week)</option>
              <option value="moderate">Moderate (3–5×/week)</option>
              <option value="active">Active (6–7×/week)</option>
              <option value="very_active">Very Active</option>
            </select>
          </div>
        </div>
        <div class="nutr-form-row single" style="margin-top:12px">
          <div class="form-group" style="margin-bottom:0">
            <label>Goal</label>
            <select id="nutr-edit-goal">
              <option value="maintenance">Maintenance</option>
              <option value="fat_loss">Fat Loss (−500 kcal/day)</option>
              <option value="muscle_gain">Muscle Gain (+300 kcal/day)</option>
              <option value="performance">Performance</option>
            </select>
          </div>
        </div>
        <div class="modal-actions" style="padding:0;margin-top:16px">
          <button class="btn-primary" style="width:100%" onclick="saveNutritionProfile(true)">Save Profile</button>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-ghost" onclick="closeNutritionSettingsModal()">Close</button>
      </div>
    </div>
  </div>

  <!-- ── Add / Edit Meal Idea Modal ── -->
  <div class="modal-backdrop" id="meal-idea-modal" onclick="if(event.target===this)closeIdeaModal()">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div class="modal-handle"></div>
      <h2 class="modal-title" id="idea-modal-title">Add Meal Idea</h2>

      <div class="form-group">
        <label>Meal name</label>
        <input id="idea-name" type="text" placeholder="e.g. Pasta with olive oil" maxlength="80" />
      </div>

      <div class="form-group">
        <label>Section</label>
        <select id="idea-section">
          <option value="breakfast">Breakfast</option>
          <option value="dinner">Dinner</option>
          <option value="snacks">Snacks</option>
        </select>
      </div>

      <div class="form-group">
        <label>Effort</label>
        <div class="effort-picker" id="idea-effort-picker">
          <button type="button" class="effort-star" data-val="1" onclick="setIdeaEffort(1)">★</button>
          <button type="button" class="effort-star" data-val="2" onclick="setIdeaEffort(2)">★</button>
          <button type="button" class="effort-star" data-val="3" onclick="setIdeaEffort(3)">★</button>
          <button type="button" class="effort-star" data-val="4" onclick="setIdeaEffort(4)">★</button>
          <button type="button" class="effort-star" data-val="5" onclick="setIdeaEffort(5)">★</button>
        </div>
        <input type="hidden" id="idea-effort" value="0" />
      </div>

      <div class="form-group">
        <label>Ingredients <span class="label-optional">(one per line)</span></label>
        <textarea id="idea-ingredients" rows="4"
          placeholder="Pasta&#10;Olive oil&#10;Garlic&#10;Parmesan"></textarea>
      </div>

      <div class="modal-actions">
        <button class="item-delete-btn btn-ghost" id="idea-delete-btn"
                style="display:none" onclick="deleteIdeaMeal()">Delete</button>
        <div style="display:flex;gap:8px;margin-left:auto">
          <button class="btn-ghost" onclick="closeIdeaModal()">Cancel</button>
          <button class="btn-primary" onclick="saveIdeaMeal()">Save</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div id="app-loading-overlay" style="position:fixed;inset:0;z-index:10000;background:var(--ink);display:flex;align-items:center;justify-content:center;transition:opacity 0.3s ease;">
    <div style="text-align:center;">
      <div style="font-size:64px;margin-bottom:20px;animation:floatBob 3s ease-in-out infinite;">🥗</div>
      <div style="color:var(--mint);font-family:'Fraunces',serif;font-size:24px;letter-spacing:-0.5px;">Nutrition</div>
      <div class="spinner" style="margin-top:24px;"></div>
    </div>
  </div>

  <script src="js/utils/date.js"></script>
  <script src="config.js" onerror="window.APP_CONFIG={}"></script>
  <script src="js/idb.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/state.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/nutrition.js"></script>
  <script src="js/init.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    }
  </script>
</body>
</html>
